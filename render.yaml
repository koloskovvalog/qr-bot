
services:
  - type: web
    name: qr-bot-pro
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: CASES_BOT_TOKEN
        sync: false

      - key: CASES_WEBHOOK_SECRET
        generateValue: true

      - key: ADMIN_IDS
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: qr-bot-pro-db
          property: connectionString

      - key: PUBLIC_BASE_URL
        sync: false

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: PYTHON_VERSION
        value: 3.12.10

databases:
  - name: qr-bot-pro-db
    plan: basic-256mb
