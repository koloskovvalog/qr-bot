name: Validate QR BOT PRO

on:
  push:
    branches:
      - qr-bot-pro-premium
  pull_request:
    branches:
      - main
      - qr-bot-pro-phase2

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m py_compile bot.py

  miniapp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate HTML and inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class Validator(HTMLParser):
              pass

          for page in ("static/index.html", "static/cases.html", "static/admin.html"):
              html = Path(page).read_text(encoding="utf-8")
              Validator().feed(html)
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              if not scripts:
                  raise SystemExit(f"No inline application script found in {page}")
              output = Path("/tmp") / (Path(page).stem + ".js")
              output.write_text(scripts[-1], encoding="utf-8")
              print(f"{page}: HTML parsed; inline JavaScript extracted")
          PY
          node --check /tmp/index.js
          node --check /tmp/cases.js
          node --check /tmp/admin.js
          node --check static/caser-features.js
